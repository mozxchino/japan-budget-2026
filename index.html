<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="งบญี่ปุ่น">

<title>งบทริปญี่ปุ่น</title>
<style>
/* Tokens follow shadcn/ui naming (background/foreground/card/muted/border/input/ring/primary/accent/destructive) on the trip's paper palette */
:root{
  color-scheme:light dark;
  --background:#F7F2EA;--foreground:#1F2A44;
  --card:#FFFDFA;--card-foreground:#1F2A44;
  --muted:#F0E8DB;--muted-foreground:#655B4C;
  --border:#E6DBC9;--input:#D9CCB6;--ring:#C8324A;
  --primary:#C8324A;--primary-foreground:#FFFFFF;
  --secondary:#EFE6D8;--secondary-foreground:#1F2A44;
  --accent:#F6CAD3;--accent-foreground:#6B2238;
  --destructive:#B4233A;--destructive-soft:#FBE7EA;
  --success:#3B7536;--success-soft:#E9F2E2;
  --warning:#865A0A;--warning-soft:#FAF0D8;
  --track:#EDE4D5;--scrim:rgba(31,42,68,.42);
  --shadow:0 1px 2px rgba(31,42,68,.05),0 10px 28px -16px rgba(31,42,68,.22);
  --radius:14px;--ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme:dark){:root{
  --background:#15171D;--foreground:#F2EDE4;
  --card:#1D2028;--card-foreground:#F2EDE4;
  --muted:#262A34;--muted-foreground:#ABA497;
  --border:#2F3441;--input:#3C4252;--ring:#EB6F82;
  --primary:#C8324A;--primary-foreground:#FFFFFF;
  --secondary:#2A2E39;--secondary-foreground:#F2EDE4;
  --accent:#4A2731;--accent-foreground:#F8CFD8;
  --destructive:#F2808F;--destructive-soft:#3A1E25;
  --success:#93C784;--success-soft:#1D2A1C;
  --warning:#E6BC62;--warning-soft:#32291A;
  --track:#2B303B;--scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.6);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--background);color:var(--foreground);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Sukhumvit Set","Thonburi",system-ui,sans-serif;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top) 0 0}
main{max-width:560px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right)) calc(var(--dock,80px) + 24px) max(16px,env(safe-area-inset-left))}
h2{font-size:18px;line-height:1.35;margin:30px 2px 10px;font-weight:650;letter-spacing:-.005em;text-wrap:balance}
h2 .h-note{display:block;font-size:15px;font-weight:400;color:var(--muted-foreground);letter-spacing:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--ring) 55%,transparent);outline-offset:2px}
/* Card */
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);padding:16px;margin:10px 0;box-shadow:var(--shadow)}
/* double-bezel hero: tray + inset card with concentric radius */
.shell{background:color-mix(in srgb,var(--muted) 70%,transparent);border:1px solid var(--border);border-radius:26px;padding:5px;margin:6px 0 12px}
.shell>.card{margin:0;border-radius:21px;padding:18px 16px 16px;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,var(--shadow)}
.sep{border:0;border-top:1px solid var(--border);margin:16px 0}
.muted{color:var(--muted-foreground)}.small{font-size:15px}.tiny{font-size:14px;line-height:1.45}.nw{white-space:nowrap}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.row>:last-child{text-align:right}
.big{font-size:44px;font-weight:700;letter-spacing:-.025em;line-height:1.05;margin:2px 0 4px}
.big .unit,.mid .unit{font-size:.6em;font-weight:600;margin-right:.08em;vertical-align:.32em;color:var(--muted-foreground)}
.big.red .unit{color:inherit}
.mid{font-size:22px;font-weight:700;letter-spacing:-.015em}
.kicker{font-size:15px;color:var(--muted-foreground);font-weight:500}
.red{color:var(--destructive)}.okc{color:var(--success)}
.tape{display:inline-block;background:var(--accent);color:var(--accent-foreground);padding:3px 12px;transform:rotate(-1.2deg);font-size:15px;font-weight:650;border-radius:3px;box-shadow:0 1px 1px rgba(31,42,68,.08)}
/* day chips (scroll strip) */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:0 -16px;padding-inline:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{position:relative;flex:0 0 auto;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;height:58px;border:1px solid var(--border);background:var(--card);border-radius:16px;padding:0 8px;font-size:19px;font-weight:650;line-height:1.1;transition:transform .2s var(--ease),background-color .2s}
.chip small{font-size:14px;font-weight:500;color:var(--muted-foreground);margin-bottom:2px}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--foreground);border-color:var(--foreground);color:var(--background)}
.chip.on small{color:inherit;opacity:.75}
.chip.dot-over::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--destructive);box-shadow:0 0 0 2px var(--card)}
.chip.on.dot-over::after{box-shadow:0 0 0 2px var(--foreground)}
.photo{display:flex;align-items:center;gap:8px;margin:12px 0 14px;font-size:17px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.photo::before{content:"";flex:0 0 auto;width:12px;height:12px;border-radius:50%;border:3px solid var(--primary);background:var(--card)}
/* Progress */
.bar{height:10px;border-radius:10px;background:var(--track);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left center;transition:transform .9s var(--ease)}
.bar.over i{background:var(--destructive)!important}
.cat{margin:14px 0}
.cat:first-of-type{margin-top:4px}
.cat .name{font-weight:550}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--muted);border-radius:14px;padding:10px 12px;min-width:0}
.stat span{display:block;font-size:14px;color:var(--muted-foreground)}
.stat b{display:block;font-size:19px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.stat b.rng{font-size:17px;line-height:1.3}
.meta-line{margin-top:10px;font-size:15px;color:var(--muted-foreground)}
.meta-line b{color:var(--foreground);font-weight:600}
/* list item row */
.list.card{padding:4px 16px}
.item{display:flex;gap:10px;align-items:flex-start;padding:14px 0;min-height:56px;border-bottom:1px solid var(--border);cursor:pointer;transition:background-color .15s}
.item:last-child{border-bottom:0}
.item:active{background:var(--muted)}
.item .main{flex:1;min-width:0;overflow-wrap:anywhere}
.item .lbl{font-weight:550;line-height:1.45}
.item .amt{text-align:right;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.item .amt b{font-size:17px;font-weight:700}
.chev{align-self:center;color:var(--muted-foreground);font-size:22px;line-height:1;margin-left:-2px;opacity:.6}
/* Badge */
.tag,.badge{display:inline-flex;align-items:center;gap:4px;font-size:14px;line-height:1.35;font-weight:550;padding:2px 9px;border-radius:999px;border:1px solid transparent;background:var(--secondary);color:var(--muted-foreground);margin-top:5px;white-space:nowrap}
.tag.ok{background:var(--success-soft);color:var(--success)}.tag.re{background:var(--warning-soft);color:var(--warning)}.tag.qt{background:var(--destructive-soft);color:var(--destructive)}
.badge.paid{background:var(--success-soft);color:var(--success);margin-top:0}
.badge.plan{background:transparent;border-color:var(--input);color:var(--muted-foreground);margin-top:0}
.badge.skip{text-decoration:line-through;margin-top:0}
.badge.warn{background:var(--destructive-soft);color:var(--destructive);font-size:15px;margin-top:8px;white-space:normal}
.help{margin:18px 0 4px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:0 14px;font-size:15px}
.help summary{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;cursor:pointer;list-style:none}
.help summary::-webkit-details-marker{display:none}
.help summary::after{content:"›";font-size:22px;line-height:1;color:var(--muted-foreground);transition:transform .2s var(--ease)}
.help[open] summary::after{transform:rotate(90deg)}
.help p{margin:0 0 10px;line-height:1.6}
/* Alert */
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin:8px 0;font-size:15px;line-height:1.55;text-wrap:pretty}
.tip::before{content:"";flex:0 0 auto;width:8px;height:8px;margin-top:.55em;border-radius:50%;background:var(--muted-foreground)}
.tip.bad{background:var(--destructive-soft);border-color:color-mix(in srgb,var(--destructive) 30%,transparent);color:var(--foreground)}
.tip.bad::before{background:var(--destructive)}
.tip.good{background:var(--success-soft);border-color:color-mix(in srgb,var(--success) 25%,transparent)}
.tip.good::before{background:var(--success)}
.banner{display:flex;width:100%;text-align:left;gap:10px;align-items:center;justify-content:space-between;background:var(--warning-soft);color:var(--warning);border:1px solid color-mix(in srgb,var(--warning) 25%,transparent);border-radius:var(--radius);padding:12px 14px;font-size:15px;font-weight:550;margin:4px 0 10px;min-height:48px}
.banner .go{white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
.empty{text-align:center;padding:22px 8px;color:var(--muted-foreground);font-size:15px}
.empty b{display:block;color:var(--foreground);font-weight:600;margin-bottom:2px}
/* Tabs (bottom, translucent material) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:color-mix(in srgb,var(--background) 78%,transparent);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);border-top:1px solid color-mix(in srgb,var(--border) 70%,transparent)}
.tabbar .list{display:flex;gap:4px;max-width:536px;margin:0 auto;background:var(--muted);border-radius:16px;padding:4px}
.tabbar .list button{flex:1;border:0;background:none;padding:8px 4px;font-size:15px;font-weight:550;color:var(--muted-foreground);border-radius:12px;min-height:48px;transition:background-color .2s,color .2s}
.tabbar .list button.on{color:var(--foreground);background:var(--card);box-shadow:0 1px 2px rgba(31,42,68,.08),0 2px 8px -4px rgba(31,42,68,.18)}
/* Button */
.fab{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:536px;margin:0 auto 8px;height:52px;border-radius:16px;border:0;background:var(--primary);color:var(--primary-foreground);font-size:18px;font-weight:650;box-shadow:0 1px 2px rgba(200,50,74,.2),0 8px 18px -10px rgba(200,50,74,.6);transition:transform .16s var(--ease),filter .16s}
.fab .plus{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:22px;line-height:1;font-weight:500}
.fab:active{transform:scale(.98);filter:brightness(.95)}
.fab[hidden]{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:14px;padding:12px 18px;font-size:17px;font-weight:650;min-height:52px;transition:transform .15s var(--ease),filter .15s}
.btn:active{transform:scale(.98);filter:brightness(.95)}
.btn.pri{background:var(--primary);color:var(--primary-foreground)}
.btn.sec{background:var(--secondary);color:var(--secondary-foreground);border-color:var(--border)}
.btn.del{background:none;color:var(--destructive);border-color:color-mix(in srgb,var(--destructive) 35%,transparent)}
.btn.ghost{background:none;min-height:46px;padding:8px 14px;font-size:16px;color:var(--muted-foreground)}
.btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.btns .btn{flex:1}
/* Sheet (bottom) */
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92dvh;border-radius:24px 24px 0 0;background:var(--background);color:var(--foreground);box-shadow:0 -10px 40px -10px rgba(0,0,0,.35)}
dialog[open]{animation:sheet-in .42s var(--ease)}
dialog.closing{animation:sheet-out .24s var(--ease) forwards}
dialog.closing::backdrop{animation:fade-out .24s ease-out forwards}
dialog::backdrop{background:var(--scrim);animation:fade-in .3s ease-out}
@keyframes sheet-in{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade-in{from{opacity:0}}
@keyframes sheet-out{to{transform:translateY(100%)}}
@keyframes fade-out{to{opacity:0}}
.dlg{padding:8px 16px 0}
.grab{width:40px;height:5px;border-radius:5px;background:var(--input);margin:0 auto 8px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.sheet-foot{position:sticky;bottom:0;z-index:1;margin:16px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--background) 22%)}
.sheet-foot .btns{margin-top:0}
/* Input */
label{display:block;font-size:15px;font-weight:550;color:var(--foreground);margin:16px 0 6px}
input,select{font:inherit;font-size:17px;width:100%;min-height:50px;padding:10px 14px;border:1px solid var(--input);border-radius:12px;background:var(--card);color:var(--foreground);min-width:0;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted-foreground) 50%),linear-gradient(135deg,var(--muted-foreground) 50%,transparent 50%);background-position:calc(100% - 20px) 52%,calc(100% - 14px) 52%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
dialog:focus,dialog:focus-visible{outline:none}
input:focus,select:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 22%,transparent)}
input[aria-invalid=true]{border-color:var(--destructive)}
.amount{font-size:24px;font-weight:700;min-height:56px}
/* ToggleGroup */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--input);background:var(--card);border-radius:12px;padding:8px 13px;font-size:15px;min-height:44px;transition:background-color .15s,border-color .15s,transform .15s var(--ease)}
.seg button:active{transform:scale(.97)}
.seg button.on{background:var(--foreground);border-color:var(--foreground);color:var(--background);font-weight:600}
.seg button[hidden]{display:none}
.more{border:0;background:none;color:var(--muted-foreground);font-size:15px;font-weight:550;min-height:44px;padding:0 4px;margin-top:4px;text-decoration:underline;text-underline-offset:3px}
.seg.cur button{min-width:56px;font-size:20px;font-weight:700;min-height:56px}
.err{color:var(--destructive);font-size:15px;margin-top:6px;min-height:1.2em}
/* Table */
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:12px 4px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
td:nth-child(2){white-space:normal}
tr:last-child td{border-bottom:0}
td:first-child,th:first-child{text-align:left}
th{color:var(--muted-foreground);font-weight:500;font-size:14px;padding-top:4px}
tr.go{cursor:pointer}
tr.go:active td{background:var(--muted)}
tr.go td:first-child{font-weight:600}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:5px 0;font-size:15px}
.kv b{font-weight:650;white-space:nowrap}
.kv.total{border-top:1px solid var(--border);margin-top:6px;padding-top:10px}
/* Toast */
.toast{position:fixed;left:50%;bottom:calc(var(--dock,80px) + 12px);transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:20;display:flex;align-items:center;gap:6px;max-width:calc(100% - 32px);background:var(--foreground);color:var(--background);border-radius:16px;padding:6px 6px 6px 16px;font-size:15px;font-weight:550;box-shadow:0 10px 30px -10px rgba(0,0,0,.45);transition:transform .35s var(--ease),opacity .25s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast:not(:has(button)){padding:12px 18px}
.toast button{border:0;background:rgba(255,255,255,.14);color:inherit;border-radius:11px;min-height:44px;min-width:64px;padding:0 16px;font-weight:650}
@media (prefers-color-scheme:dark){.tabbar .list button.on{background:#3A404F}.toast button{background:rgba(0,0,0,.08)}.shell>.card{box-shadow:var(--shadow)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (prefers-reduced-transparency:reduce){.tabbar{background:var(--background);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (max-width:359px){.big{font-size:38px}.stat b{font-size:17px}.tabbar .list button{font-size:14px}}
</style>
</head>

const DEFAULTS={fund:200000,food:70000,reserve:20000,fx:0.2067};
const KEY='jp26-budget-v1';

// ---------- state ----------
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function seedState(){
  return {...DEFAULTS,lastBackup:null,dirty:false,items:SEED.map(([day,cat,label,low,high,cur,tag,x={}])=>({
    id:uid(),day,cat,label,low,high,cur,tag,pre:!!x.pre,opt:!!x.opt,note:x.note||'',
    st:x.paid!=null?'paid':'plan',paid:x.paid!=null?x.paid:null,sub:null,extra:false}))};
}
function validState(s){
  return !!s&&typeof s==='object'&&Array.isArray(s.items)&&['fund','food','reserve','fx'].every(k=>typeof s[k]==='number'&&isFinite(s[k]))&&s.fx>0
    &&s.items.every(it=>it&&typeof it.day==='number'&&DAYS.some(x=>x.d===it.day)&&CATS[it.cat]&&(it.cur==='JPY'||it.cur==='THB')&&isFinite(it.low)&&isFinite(it.high));
}
let S;
try{const raw=localStorage.getItem(KEY);S=raw?JSON.parse(raw):null;}catch(e){S=null}
if(!validState(S))S=seedState();
let storageOK=true;
function save(markDirty=true){
  if(markDirty)S.dirty=true;
  try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}
}

// ---------- money math ----------
const r2=n=>Math.round(n*100)/100;
const toTHB=(a,cur)=>cur==='THB'?a:a*S.fx;
const toJPY=(a,cur)=>cur==='JPY'?a:a/S.fx;
const yen=n=>'¥'+Math.round(n).toLocaleString('en-US');
const baht=n=>'฿'+r2(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const bahtR=n=>'฿'+Math.round(n).toLocaleString('en-US');
const range=(f,a,b)=>Math.round(a)===Math.round(b)?f(a):f(a)+'–'+f(b).replace(/^[¥฿]/,'');
const inFund=it=>!CATS[it.cat].out;
// committed amount of one item, in its own currency [low, high]
function commit(it){
  if(it.st==='paid')return[it.paid||0,it.paid||0];
  if(it.st==='skip')return[0,0];
  return[it.low,it.high];
}
const spent=it=>it.st==='paid'?(it.paid||0):0;
const totalW=()=>DAYS.reduce((a,x)=>a+x.w,0);
// trip day number of "now": 8 before the trip, 20 after it
let NOW=()=>new Date();
function refDay(){const n=NOW();if(n<new Date(2026,10,9))return 8;if(n>=new Date(2026,10,20))return 20;return n.getDate()}
const dayW=d=>DAYS.find(x=>x.d===d).w;
function foodSpentDay(d){return S.items.filter(it=>it.cat==='food'&&it.day===d).reduce((a,it)=>a+toJPY(spent(it),it.cur),0)}
function foodPlanDay(d){return toJPY(S.food,'THB')*dayW(d)/totalW()}
// today and earlier: what is really left of the food budget, spread over the remaining days (by weight).
// future days keep the plain plan, so days nobody has logged yet don't roll forward early.
function foodLeftDay(d){
  if(d>refDay())return foodPlanDay(d);
  const before=DAYS.filter(x=>x.d<d).reduce((a,x)=>a+foodSpentDay(x.d),0);
  const wLeft=DAYS.filter(x=>x.d>=d).reduce((a,x)=>a+x.w,0);
  return Math.max(0,toJPY(S.food,'THB')-before)*dayW(d)/wLeft;
}
// one day of cash spending in JPY (excludes things paid before the trip and out-of-fund items)
function dayCalc(d){
  const its=S.items.filter(it=>it.day===d);
  const cash=its.filter(it=>!it.pre&&inFund(it));
  const cats={};
  for(const c of DAY_CATS)cats[c]={low:0,high:0,spent:0};
  let reserveUsed=0;
  for(const it of cash){
    if(it.cat==='misc'){reserveUsed+=toTHB(spent(it),it.cur);continue}
    const k=it.cat;if(!cats[k])cats[k]={low:0,high:0,spent:0};
    if(it.cat!=='food'&&it.st!=='skip'){cats[k].low+=toJPY(it.low,it.cur);cats[k].high+=toJPY(it.high,it.cur)}
    cats[k].spent+=toJPY(spent(it),it.cur);
  }
  const fl=foodLeftDay(d);cats.food.low=fl;cats.food.high=fl;
  let low=0,high=0,sp=0;
  for(const c in cats){low+=cats[c].low;high+=cats[c].high;sp+=cats[c].spent}
  const unpaid=cash.filter(it=>it.st==='plan'&&it.cat!=='food');
  const out=its.filter(it=>!inFund(it)&&!it.pre).reduce((a,it)=>a+toTHB(spent(it),it.cur),0);
  return{its,cats,low,high,spent:sp,unpaid,out,reserveUsed,foodPlan:foodPlanDay(d),foodLeft:fl,
    over:Object.keys(cats).filter(c=>cats[c].spent>cats[c].high+0.5).map(c=>({c,by:cats[c].spent-cats[c].high}))};
}
// whole trip in THB
function tripCalc(){
  const byCat={};
  for(const k of Object.keys(CATS))byCat[k]={low:0,high:0,spent:0};
  let pLow=0,pHigh=0,sp=0,misc=0,outSp=0;
  for(const it of S.items){
    const[a,b]=commit(it),s=toTHB(spent(it),it.cur);
    byCat[it.cat].spent+=s;
    if(inFund(it))sp+=s;else outSp+=s;
    if(it.cat==='food')continue;
    byCat[it.cat].low+=toTHB(a,it.cur);byCat[it.cat].high+=toTHB(b,it.cur);
    if(!inFund(it))continue;
    if(it.cat==='misc')misc+=s;
    else{pLow+=toTHB(a,it.cur);pHigh+=toTHB(b,it.cur)}
  }
  const foodSp=byCat.food.spent;
  const foodAlloc=Math.max(S.food,foodSp);
  byCat.food.low=byCat.food.high=S.food;
  byCat.misc.low=byCat.misc.high=S.reserve;
  const reserveAlloc=Math.max(S.reserve,misc);
  const totLow=pLow+foodAlloc+reserveAlloc,totHigh=pHigh+foodAlloc+reserveAlloc;
  return{pLow,pHigh,foodAlloc,foodSp,foodLeft:S.food-foodSp,reserveLeft:S.reserve-misc,misc,reserveAlloc,totLow,totHigh,
    freeLow:S.fund-totHigh,freeHigh:S.fund-totLow,spent:sp,byCat,outSp};
}
window.Calc={dayCalc,tripCalc,foodLeftDay,foodPlanDay,seedState,validState,getS:()=>S,setS:x=>{S=x},setNow:f=>{NOW=f}};
// ---------- view helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
// categories shown first in the add form (the rest sit behind "หมวดอื่น")
const CAT_MAIN=['food','train','taxi','ticket','fuel','shop','misc'];
function todayDay(){
  const n=new Date();
  return n.getFullYear()===2026&&n.getMonth()===10&&n.getDate()>=9&&n.getDate()<=19?n.getDate():null;
}
let tab='day',cur=todayDay()||9;
// display only: shrink the leading ¥/฿ of a formatted amount (yen/baht themselves stay unchanged)
const unit=s=>s.replace(/^([¥฿])/,'<span class="unit">$1</span>');
function bar(p,color,over){return `<div class="bar${over?' over':''}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(Math.max(0,p))}"><i data-w="${Math.max(0,Math.min(100,p))}" style="background:${color}"></i></div>`}
function animateBars(){requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.bar i').forEach(e=>e.style.transform=`scaleX(${e.dataset.w/100})`)))}
function tagHtml(it){return it.tag?`<span class="tag ${it.tag}">${TAGS[it.tag]}</span>`:''}
function amtOf(it){
  const f=it.cur==='JPY'?yen:baht;
  if(it.st==='paid')return `<b>${f(it.paid)}</b><span class="tiny muted">${it.extra?(it.cur==='JPY'?'≈ '+baht(toTHB(it.paid,'JPY')):''):'แผน '+range(f,it.low,it.high)}</span>`;
  return `<b>${range(f,it.low,it.high)}</b>${it.cur==='THB'?'':`<span class="tiny muted">≈ ${range(bahtR,toTHB(it.low,'JPY'),toTHB(it.high,'JPY'))}</span>`}`;
}
function itemRow(it,showDay){
  const st=it.st==='paid'?'<span class="badge paid">✓ จ่ายแล้ว</span>':it.st==='skip'?'<span class="badge skip">ไม่ใช้</span>':'<span class="badge plan">ยังไม่จ่าย</span>';
  const sub=it.cat==='food'&&it.sub==='snack'?' · กินเล่น':'';
  return `<div class="item" data-id="${it.id}" role="button" tabindex="0"><div class="main"><div class="lbl">${esc(it.label||CATS[it.cat].n).replace(/(\d)–(\d)/g,'$1–\u2060$2')}</div>
  <div class="tiny muted">${showDay?'Day '+it.day+' · ':''}${CATS[it.cat].n}${sub}${it.pre?' · จ่ายล่วงหน้า':''}${it.opt?' · ทางเลือก':''}</div>
  ${tagHtml(it)}${it.note?`<div class="tiny muted" style="margin-top:4px">${esc(it.note)}</div>`:''}</div>
  <div class="amt">${amtOf(it)}${st}</div><span class="chev" aria-hidden="true">›</span></div>`;
}

function viewTrip(){
  const t=tripCalc();
  const catRows=Object.keys(CATS).filter(k=>!CATS[k].out).map(k=>{
    const q=t.byCat[k];const p=q.high?q.spent/q.high*100:(q.spent?101:0);const ov=q.spent>q.high+0.5;
    return `<div class="cat"><div class="row"><span class="name">${CATS[k].n}</span><span class="small ${ov?'red':'muted'}">${Math.round(p)}%</span></div>
    ${bar(p,CATS[k].c,ov)}<div class="row tiny muted"><span>จ่ายแล้ว ${baht(q.spent)}</span><span>${k==='misc'?'สำรอง '+baht(S.reserve):k==='food'?'งบ '+baht(S.food):'แผน '+range(bahtR,q.low,q.high)}</span></div></div>`}).join('');
  const outRows=Object.keys(CATS).filter(k=>CATS[k].out).map(k=>`<div class="kv"><span>${CATS[k].n}</span><b>${baht(t.byCat[k].spent)}</b></div>`).join('');
  const dayRows=DAYS.map(x=>{const c=dayCalc(x.d);const st=c.over.length?'<span class="badge" style="background:var(--destructive-soft);color:var(--destructive)">เกิน</span>':c.spent>0?'<span class="badge paid">ok</span>':'';
    return `<tr class="go" data-day="${x.d}"><td>Day ${x.d}</td><td>${range(yen,c.low,c.high)}</td><td>${yen(c.spent)}</td><td>${st}</td></tr>`}).join('');
  const free=t.freeLow>=0?`<b class="mid okc">${unit(range(bahtR,t.freeLow,t.freeHigh))}</b>`:t.freeHigh<0?`<b class="mid red">เกิน ${range(bahtR,-t.freeHigh,-t.freeLow)}</b>`:`<b class="mid red">${baht(t.freeLow)} ถึง ${baht(t.freeHigh)}</b>`;
  return `${banner()}
  <div class="shell"><div class="card">
    <span class="tape">กองทริป · ไม่รวมเครื่องบิน</span>
    <div class="kicker" style="margin-top:14px">จ่ายจริงแล้วจากกอง</div>
    <div class="big">${unit(baht(t.spent))}</div>
    <div class="muted small">จาก ${baht(S.fund)} · เงินในกองเหลือจริง ${baht(S.fund-t.spent)}</div>
    ${bar(t.spent/S.fund*100,'#A8C686',t.spent>S.fund)}
    <hr class="sep">
    <div class="kv"><span>ที่พัก+เดินทาง+ค่าเข้า+รถ</span><b>${range(bahtR,t.pLow,t.pHigh)}</b></div>
    <div class="kv"><span>อาหาร (กันไว้)</span><b>${baht(t.foodAlloc)}</b></div>
    <div class="kv"><span>สำรอง</span><b>${baht(t.reserveAlloc)}</b></div>
    <div class="kv total"><span>รวมทั้งแผน</span><b>${range(bahtR,t.totLow,t.totHigh)}</b></div>
    <div class="kv" style="align-items:center;margin-top:4px"><span>ยังว่างในกอง</span>${free}</div>
    <div class="grid2" style="margin-top:12px">
      <div class="stat"><span>เงินกินเหลือ</span><b class="${t.foodLeft<0?'red':''}">${baht(t.foodLeft)}</b></div>
      <div class="stat"><span>สำรองเหลือ</span><b class="${t.reserveLeft<0?'red':''}">${baht(t.reserveLeft)}</b></div>
    </div>
  </div></div>
  <h2>แยกตามหมวด<span class="h-note">ในกอง ${baht(S.fund)}</span></h2><div class="card">${catRows}</div>
  <h2>นอกกอง<span class="h-note">จ่ายแยก ไม่นับใน ${baht(S.fund)}</span></h2><div class="card">${outRows}<div class="kv total"><span>รวมนอกกอง</span><b>${baht(t.outSp)}</b></div></div>
  <h2>รายวัน<span class="h-note">¥ · 4 คน · ไม่รวมจ่ายล่วงหน้า · แตะเพื่อเปิดวันนั้น</span></h2><div class="card" style="padding:8px 16px"><table><tr><th>วัน</th><th>ตามงบ–ไม่เกิน</th><th>ใช้</th><th></th></tr>${dayRows}</table></div>
  <h2>ทุกรายการ</h2><div class="card list">${S.items.slice().sort((a,b)=>a.day-b.day).map(it=>itemRow(it,true)).join('')}</div>`;
}

// ---------- settings ----------
function viewSet(){
  const lb=S.lastBackup?new Date(S.lastBackup).toLocaleString('th-TH'):'ยังไม่เคย';
  return `<h2>Backup</h2><div class="card">
  <div class="small muted">ข้อมูลเก็บในเครื่องนี้เท่านั้น · Backup ล่าสุด: <b class="nw" style="color:var(--foreground)">${esc(lb)}</b></div>
  <div class="small muted" style="margin-top:4px">กด Backup แล้วเลือก "บันทึกไปยังไฟล์" หรือส่งเข้า LINE ตัวเอง</div>
  <div class="btns"><button type="button" class="btn pri" id="exp">Backup (ส่งออกไฟล์)</button></div>
  <div class="btns" style="margin-top:8px"><button type="button" class="btn sec" id="impBtn">กู้คืนจากไฟล์</button></div>
  <input type="file" id="imp" accept="application/json,.json" hidden>
  <div class="err" id="impErr"></div></div>
  <h2>ตั้งค่างบ</h2><div class="card">
  <label for="sFund" style="margin-top:0">กองทริป (฿, ไม่รวมเครื่องบิน)</label><input id="sFund" inputmode="decimal" value="${S.fund.toLocaleString('en-US')}">
  <label for="sFood">งบอาหารทั้งทริป (฿)</label><input id="sFood" inputmode="decimal" value="${S.food.toLocaleString('en-US')}">
  <label for="sRes">เงินสำรอง (฿)</label><input id="sRes" inputmode="decimal" value="${S.reserve.toLocaleString('en-US')}">
  <label for="sFx">อัตรา ฿ ต่อ ¥1</label><input id="sFx" inputmode="decimal" value="${S.fx}">
  <div class="err" id="setErr"></div>
  <div class="btns" style="margin-top:8px"><button type="button" class="btn pri" id="saveSet">บันทึก</button></div></div>
  <h2>เริ่มใหม่</h2><div class="card"><div class="small muted">ล้างทุกอย่างกลับเป็นแผนตั้งต้น ควร Backup ก่อน</div>
  <div class="btns"><button type="button" class="btn del" id="reset">ล้างข้อมูลทั้งหมด</button></div></div>`;
}
function banner(){
  if(!storageOK)return '<div class="banner" role="alert">บันทึกลงเครื่องไม่ได้ (โหมดส่วนตัว?) ข้อมูลอาจหาย · กด Backup ไว้ก่อน</div>';
  if(S.dirty&&(!S.lastBackup||Date.now()-S.lastBackup>864e5))return '<button type="button" class="banner" data-goto="set"><span>มีรายการใหม่ยังไม่ได้ Backup</span><span class="go">ไป Backup ›</span></button>';
  return '';
}
let toastT;
function toast(msg,undo){
  const el=$('#toast');clearTimeout(toastT);
  el.innerHTML=`<span>${esc(msg)}</span>${undo?'<button type="button" id="undo">เลิกทำ</button>':''}`;
  if(undo)el.querySelector('#undo').onclick=()=>{undo();el.classList.remove('show')};
  el.classList.add('show');toastT=setTimeout(()=>el.classList.remove('show'),undo?8000:2200);
}

// ---------- render ----------
function render(){
  $('#v').innerHTML=tab==='day'?viewDay():tab==='trip'?viewTrip():viewSet();
  document.querySelectorAll('.tabbar .list button').forEach(b=>{b.classList.toggle('on',b.dataset.tab===tab);b.setAttribute('aria-selected',b.dataset.tab===tab)});
  $('#fab').hidden=tab==='set';
  animateBars();
  if(tab==='day'){const on=document.querySelector('.chip.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'})}
  if(tab==='set')bindSet();
}
document.querySelector('.tabbar').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render();scrollTo(0,0)}});
// content and toast clear the fixed bottom bar, whatever its height (button hidden on settings, safe area, text size)
new ResizeObserver(([e])=>document.documentElement.style.setProperty('--dock',e.target.offsetHeight+'px')).observe($('.tabbar'));
$('#v').addEventListener('click',e=>{
  const g=e.target.closest('[data-goto]');if(g){tab=g.dataset.goto;render();scrollTo(0,0);return}
  const ch=e.target.closest('[data-day]');
  if(ch){cur=+ch.dataset.day;const fromTable=ch.tagName==='TR';tab='day';render();if(fromTable)scrollTo(0,0);return}
  const it=e.target.closest('.item');if(it)openEdit(S.items.find(z=>z.id===it.dataset.id));
});
$('#v').addEventListener('keydown',e=>{const it=e.target.closest('.item');if(it&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openEdit(S.items.find(z=>z.id===it.dataset.id))}});
$('#fab').addEventListener('click',()=>openEdit(null));

// ---------- add / edit dialog ----------
const dlg=$('#dlg'),form=$('#form');
const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:NaN};
function openEdit(it){
  const isNew=!it;
  // new expense starts in the category of the last one added (read from the saved items, nothing extra stored)
  const last=S.items.filter(z=>z.extra).pop();
  const m=it?{...it}:{id:uid(),day:cur,cat:last?last.cat:'food',label:'',low:0,high:0,cur:'JPY',tag:null,pre:false,opt:false,note:'',st:'paid',paid:null,sub:last&&last.cat==='food'?last.sub||'meal':'meal',extra:true};
  const allCats=!CAT_MAIN.includes(m.cat);
  const catBtns=Object.keys(CATS).map(k=>`<button type="button" data-cat="${k}" class="${m.cat===k?'on':''}" aria-pressed="${m.cat===k}"${allCats||CAT_MAIN.includes(k)?'':' hidden'}>${CATS[k].n}</button>`).join('');
  form.innerHTML=`<div class="grab" aria-hidden="true"></div><div class="sheet-head"><b class="mid" id="dlgTitle">${isNew?'จ่ายเพิ่ม':'แก้รายการ'}</b><button type="button" class="btn ghost" id="x">ปิด</button></div>
  ${isNew?'':`<div class="small" style="font-weight:600;overflow-wrap:anywhere">${esc(m.label||CATS[m.cat].n)}</div>`}
  ${m.tag?tagHtml(m):''}
  <label for="fPaid">จ่ายจริง</label>
  <div style="display:flex;gap:8px"><input id="fPaid" class="amount" inputmode="decimal" autocomplete="off" placeholder="${m.extra?'เช่น 1200':Math.round(m.low)}" value="${m.paid!=null?m.paid:''}" style="flex:1">
  <div class="seg cur" id="fCur" style="flex-wrap:nowrap" role="group" aria-label="สกุลเงิน"><button type="button" data-cur="JPY" class="${m.cur==='JPY'?'on':''}" aria-label="เยน">¥</button><button type="button" data-cur="THB" class="${m.cur==='THB'?'on':''}" aria-label="บาท">฿</button></div></div>
  <div class="err" id="fErr" role="alert"></div>
  <label>หมวด${isNew&&last?' <span class="muted" style="font-weight:400">· เลือกไว้ตามรายการล่าสุด</span>':''}</label><div class="seg" id="fCat" role="group" aria-label="หมวด">${catBtns}</div>${allCats?'':'<button type="button" class="more" id="fMore">หมวดอื่น (รถเช่า ที่พัก เครื่องบิน นอกกอง)</button>'}
  <div id="fSubWrap"${m.cat==='food'?'':' hidden'}><label>ประเภทอาหาร</label><div class="seg" id="fSub"><button type="button" data-sub="meal" class="${m.sub!=='snack'?'on':''}">มื้อหลัก</button><button type="button" data-sub="snack" class="${m.sub==='snack'?'on':''}">กินเล่น/ขนม/เครื่องดื่ม</button></div></div>
  ${m.extra?'':`<label>สถานะ</label><div class="seg" id="fSt"><button type="button" data-st="plan" class="${m.st==='plan'?'on':''}">ยังไม่จ่าย</button><button type="button" data-st="paid" class="${m.st==='paid'?'on':''}">จ่ายแล้ว</button><button type="button" data-st="skip" class="${m.st==='skip'?'on':''}">ไม่ใช้</button></div>
  <div class="grid2"><div><label for="fLow">ตามงบ (ต่ำสุด)</label><input id="fLow" inputmode="decimal" value="${m.low}"></div><div><label for="fHigh">ไม่เกิน</label><input id="fHigh" inputmode="decimal" value="${m.high}"></div></div>`}
  <label for="fLabel">รายละเอียด</label><input id="fLabel" value="${esc(m.label)}" placeholder="ราเม็ง 4 ที่">
  <div class="grid2"><div><label for="fDay">วัน</label><select id="fDay">${DAYS.map(x=>`<option value="${x.d}"${x.d===m.day?' selected':''}>Day ${x.d}</option>`).join('')}</select></div>
  <div><label for="fPre">จ่ายก่อนเดินทาง</label><select id="fPre"><option value="0">ไม่ใช่</option><option value="1"${m.pre?' selected':''}>ใช่</option></select></div></div>
  <label for="fNote">หมายเหตุ</label><input id="fNote" value="${esc(m.note||'')}">
  ${isNew?'':'<div class="btns"><button type="button" class="btn del" id="del">ลบรายการนี้</button></div>'}
  <div class="sheet-foot"><div class="btns"><button type="button" class="btn pri" id="ok">บันทึก</button></div></div>`;
  const paidIn=form.querySelector('#fPaid'),err=form.querySelector('#fErr');
  const seg=(id,attr,key)=>{const el=form.querySelector(id);if(!el)return;el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;m[key]=b.dataset[attr];el.querySelectorAll('button').forEach(z=>{z.classList.toggle('on',z===b);if(z.hasAttribute('aria-pressed'))z.setAttribute('aria-pressed',z===b)});
    if(key==='cat')form.querySelector('#fSubWrap').hidden=m.cat!=='food';
    if(key==='st'&&m.st==='paid'&&!paidIn.value&&m.low===m.high)paidIn.value=m.low;})};
  seg('#fCat','cat','cat');seg('#fSub','sub','sub');seg('#fCur','cur','cur');seg('#fSt','st','st');
  paidIn.addEventListener('input',()=>{err.textContent='';paidIn.removeAttribute('aria-invalid');if(!m.extra&&paidIn.value&&m.st==='plan'){m.st='paid';form.querySelectorAll('#fSt button').forEach(z=>z.classList.toggle('on',z.dataset.st==='paid'))}});
  const more=form.querySelector('#fMore');if(more)more.onclick=()=>{form.querySelectorAll('#fCat [hidden]').forEach(b=>b.hidden=false);more.remove()};
  form.querySelector('#x').onclick=closeSheet;
  form.querySelector('#ok').onclick=()=>{
    const p=paidIn.value.trim(),pv=num(p);
    if(m.extra||m.st==='paid'){if(!p||!(pv>=0)){err.textContent='ใส่จำนวนเงินที่จ่ายจริงก่อน (ตัวเลข เช่น 1200)';paidIn.setAttribute('aria-invalid','true');paidIn.focus();return}m.paid=pv;m.st='paid'}
    else m.paid=p&&pv>=0?pv:null;
    if(!m.extra){const lo=num(form.querySelector('#fLow').value),hi=num(form.querySelector('#fHigh').value);
      if(!(lo>=0)||!(hi>=lo)){err.textContent='ตามงบ/ไม่เกิน ไม่ถูก (ไม่เกินต้อง ≥ ตามงบ)';return}m.low=lo;m.high=hi}
    m.label=form.querySelector('#fLabel').value.trim();m.note=form.querySelector('#fNote').value.trim();
    m.day=+form.querySelector('#fDay').value;m.pre=form.querySelector('#fPre').value==='1';
    if(m.cat!=='food')m.sub=null;
    const i=S.items.findIndex(z=>z.id===m.id);if(i>=0)S.items[i]=m;else S.items.push(m);
    save();closeSheet();render();toast(storageOK?'บันทึกแล้ว':'บันทึกลงเครื่องไม่ได้ · กด Backup ไว้ก่อน');
  };
  const del=form.querySelector('#del');
  if(del)del.onclick=()=>{if(confirm('ลบรายการนี้?')){const i=S.items.findIndex(z=>z.id===m.id),old=S.items[i];S.items=S.items.filter(z=>z.id!==m.id);save();closeSheet();render();
    toast('ลบรายการแล้ว',()=>{S.items.splice(Math.min(i,S.items.length),0,old);save();render()})}};
  dlg.classList.remove('closing');dlg.showModal();
  if(isNew)paidIn.focus();
}
// slide the sheet back down the way it came, then close (reduced motion: durations are ~0 so it closes at once)
function closeSheet(){
  if(!dlg.open||dlg.classList.contains('closing'))return;
  const done=()=>{clearTimeout(t);dlg.removeEventListener('animationend',done);dlg.classList.remove('closing');dlg.close()};
  const t=setTimeout(done,320);dlg.addEventListener('animationend',done);dlg.classList.add('closing');
}
dlg.addEventListener('cancel',e=>{e.preventDefault();closeSheet()});

// ---------- backup ----------
function bindSet(){
  $('#exp').onclick=async()=>{
    const name=`japan-budget-backup-${new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')}.json`;
    const out={...S};delete out.dirty;
    const blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
    try{
      const file=new File([blob],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:'Backup งบญี่ปุ่น'});
      else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
      S.lastBackup=Date.now();S.dirty=false;save(false);render();toast('Backup แล้ว');
    }catch(e){if(e.name!=='AbortError')alert('Backup ไม่สำเร็จ: '+e.message)}
  };
  $('#impBtn').onclick=()=>$('#imp').click();
  $('#imp').onchange=e=>{
    const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{let d;try{d=JSON.parse(rd.result)}catch(x){d=null}
      e.target.value='';
      if(!validState(d)){$('#impErr').textContent='ไฟล์นี้ไม่ใช่ Backup ของแอปนี้ หรือไฟล์เสีย';return}
      if(!confirm(`กู้คืน ${d.items.length} รายการ? ข้อมูลในเครื่องตอนนี้จะถูกแทนที่`))return;
      d.dirty=false;S=d;save(false);tab='day';render();toast(`กู้คืน ${d.items.length} รายการแล้ว`)};
    rd.readAsText(f);
  };
  $('#saveSet').onclick=()=>{
    const v={fund:num($('#sFund').value),food:num($('#sFood').value),reserve:num($('#sRes').value),fx:num($('#sFx').value)};
    if(!(v.fund>0&&v.food>=0&&v.reserve>=0&&v.fx>0&&v.fx<5)){$('#setErr').textContent='ตัวเลขไม่ถูก ตรวจอีกครั้ง (อัตราแลกเงินต้องมากกว่า 0 และน้อยกว่า 5)';return}
    Object.assign(S,v);save();render();toast('บันทึกงบแล้ว');
  };
  $('#reset').onclick=()=>{if(confirm('ล้างข้อมูลทั้งหมดกลับเป็นแผนตั้งต้น? (ย้อนกลับไม่ได้ ถ้าไม่ได้ Backup)')){S=seedState();save(false);tab='day';render()}};
}

render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
